name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT and luacheck
        run: sudo apt-get update && sudo apt-get install -y luajit lua-check
      - name: Syntax
        run: for f in tesserae.koplugin/*.lua; do luajit -bl "$f" > /dev/null; done
      - name: Lint
        run: luacheck tesserae.koplugin spec
      - name: Tests
        run: luajit spec/run.lua
      - name: Package
        run: |
          mkdir -p dist
          zip -r "dist/tesserae.koplugin-${GITHUB_REF_NAME}.zip" tesserae.koplugin -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: tesserae.koplugin
          path: dist/*.zip
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          mkdir -p dist
          zip -r "dist/tesserae.koplugin-${GITHUB_REF_NAME}.zip" tesserae.koplugin -x '*.DS_Store'
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
